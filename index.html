<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Partículas Metamórficas 3D</title>

<meta name="description" content="Simulación interactiva de partículas metamórficas 3D creada con Three.js">

<meta property="og:title" content="Partículas Metamórficas 3D">
<meta property="og:description" content="Experiencia visual e interactiva 3D en tiempo real con WebGL.">
<meta property="og:type" content="website">

<style>
:root{
  --bg:#000;
  --fg:#e8f0ff;
  --accent:#1f6bff;
  --muted:#7f8aa3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000;
    --fg:#e8f0ff
  }
}

:root[data-theme="dark"]{
  --bg:#000;
  --fg:#e8f0ff
}

html,body{
  height:100%;
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  overflow:hidden
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
  cursor:grab
}

#marca{
  position:fixed;
  top:calc(env(safe-area-inset-top,0px) + 16px);
  left:18px;
  font-weight:700;
  letter-spacing:.02em;
  pointer-events:none;
  z-index:10
}

#marca small{
  display:block;
  font-weight:400;
  color:var(--muted);
  font-size:.78rem;
  margin-top:2px
}

button{
  font:inherit;
  font-size:.9rem;
  color:var(--fg);
  background:rgba(31,107,255,.12);
  border:1px solid rgba(31,107,255,.45);
  border-radius:999px;
  padding:9px 16px;
  cursor:pointer;
  transition:background .2s,border-color .2s,transform .2s
}

button:hover{
  background:rgba(31,107,255,.3);
  transform:translateY(-1px)
}

button:focus-visible{
  outline:2px solid #fff;
  outline-offset:2px
}

button.on{
  background:var(--accent);
  border-color:var(--accent)
}

[hidden]{
  display:none !important
}

#ui{
  transition:opacity .6s
}

#ui.oculta{
  opacity:0;
  pointer-events:none
}

.glass{
  background:rgba(8,12,26,.62);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(31,107,255,.35)
}

#barra{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  display:flex;
  align-items:center;
  gap:4px;
  padding:6px;
  border-radius:999px;
  z-index:10
}

#barra button{
  background:transparent;
  border-color:transparent
}

#barra button:hover{
  background:rgba(31,107,255,.25)
}

#prev,#next{
  width:40px;
  height:40px;
  padding:0;
  font-size:1.3rem;
  line-height:1
}

#nombre{
  min-width:150px
}

#menu{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 76px);
  display:flex;
  flex-direction:column;
  gap:4px;
  padding:8px;
  border-radius:16px;
  z-index:10;
  max-height:55vh;
  overflow-y:auto;
  scrollbar-width:thin
}

#menu button{
  text-align:left;
  border-radius:10px;
  white-space:nowrap
}

#ajustes{
  position:fixed;
  top:calc(env(safe-area-inset-top,0px) + 12px);
  right:12px;
  width:42px;
  height:42px;
  padding:0;
  border-radius:50%;
  font-size:1.15rem;
  z-index:10
}

#panel{
  position:fixed;
  top:calc(env(safe-area-inset-top,0px) + 62px);
  right:12px;
  width:min(280px,calc(100vw - 24px));
  padding:14px;
  border-radius:16px;
  display:flex;
  flex-direction:column;
  gap:10px;
  z-index:10
}

#panel p{
  margin:0;
  font-size:.82rem;
  color:var(--muted)
}

#modos,#colores{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

#modos button{
  padding:6px 11px;
  font-size:.8rem
}

input[type=range]{
  width:100%;
  accent-color:var(--accent)
}

.sw{
  width:26px;
  height:26px;
  padding:0;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.25);
  background:var(--c) !important
}

.sw:hover,.sw.on{
  border-color:#fff
}

@media(max-width:600px){
  #marca{
    left:12px;
    top:12px
  }

  #nombre{
    min-width:125px
  }

  #menu{
    max-width:calc(100vw - 30px)
  }
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="marca">
  Mi Proyecto 3D
  <small>Partículas Interactivas</small>
</div>

<div id="ui">

  <button id="ajustes" class="glass" aria-label="Ajustes">⚙</button>

  <div id="panel" class="glass" hidden>

    <p>Al tocar la pantalla</p>

    <div id="modos"></div>

    <p>Color</p>

    <div id="colores"></div>

    <div id="filaBrillo">
      <p>Brillo</p>
      <input
        type="range"
        id="brillo"
        min="0"
        max="2"
        step="0.05"
        value="0.9"
        aria-label="Brillo">
    </div>

    <p>Pellizcá o usá la rueda para hacer zoom.</p>

  </div>

  <div id="menu" class="glass" hidden></div>

  <div id="barra" class="glass">
    <button id="prev" aria-label="Forma anterior">‹</button>
    <button id="nombre" aria-haspopup="true">Hélice</button>
    <button id="next" aria-label="Forma siguiente">›</button>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const esMovil = /Android|iPhone|iPad/i.test(navigator.userAgent);

const N = esMovil ? 9000 : 15000;
const SIZE = 60;

function normalise(pts,size){
  let max=0;

  for(const p of pts){
    max=Math.max(max,p.length());
  }

  const k=(size/2)/(max||1);

  return pts.map(p=>p.multiplyScalar(k));
}

const V=(x,y,z)=>new THREE.Vector3(x,y,z);


/* =========================================================
   FORMAS ORIGINALES
========================================================= */

function dualHelix(n){

  const pts=[];
  const turns=5;
  const radius=15;
  const height=40;

  for(let i=0;i<n;i++){

    const second=i%2===0;
    const angle=(i/n)*Math.PI*2*turns;
    const y=(i/n)*height-height/2;
    const r=radius+(second?5:-5);

    pts.push(
      V(
        Math.cos(angle)*r,
        y,
        Math.sin(angle)*r
      )
    );
  }

  return normalise(pts,SIZE);
}


function dnaHelix(n){

  const pts=[];
  const turns=6;
  const height=48;
  const radius=12;
  const strands=Math.floor(n*.7);

  for(let i=0;i<n;i++){

    if(i<strands){

      const strand=i%2;
      const t=i/strands;

      const angle=
        t*Math.PI*2*turns+
        strand*Math.PI;

      const y=t*height-height/2;

      pts.push(
        V(
          Math.cos(angle)*radius,
          y,
          Math.sin(angle)*radius
        )
      );

    }else{

      const t=Math.random();
      const angle=
        Math.floor(t*turns*2)*
        (Math.PI/turns);

      const y=t*height-height/2;
      const r=(Math.random()-.5)*radius*2;

      pts.push(
        V(
          Math.cos(angle)*r,
          y,
          Math.sin(angle)*r
        )
      );
    }
  }

  return normalise(pts,SIZE);
}


function hypercube(n){

  const pts=[];

  for(let i=0;i<n;i++){

    const isInner=i%2===0;
    const side=isInner?10:22;

    const face=Math.floor(Math.random()*6);

    let x=(Math.random()-.5)*side;
    let y=(Math.random()-.5)*side;
    let z=(Math.random()-.5)*side;

    if(face===0)x=side/2;
    else if(face===1)x=-side/2;
    else if(face===2)y=side/2;
    else if(face===3)y=-side/2;
    else if(face===4)z=side/2;
    else z=-side/2;

    pts.push(V(x,y,z));
  }

  return normalise(pts,SIZE);
}


function sphere(n){

  const pts=[];

  for(let i=0;i<n;i++){

    const y=1-2*(i+.5)/n;
    const r=Math.sqrt(1-y*y);
    const phi=i*2.399963;

    pts.push(
      V(
        Math.cos(phi)*r,
        y,
        Math.sin(phi)*r
      ).multiplyScalar(20)
    );
  }

  return normalise(pts,SIZE);
}


function torus(n){

  const pts=[];

  for(let i=0;i<n;i++){

    const u=Math.random()*Math.PI*2;
    const v=Math.random()*Math.PI*2;

    const R=20;
    const r=7+Math.random()*2;

    pts.push(
      V(
        (R+r*Math.cos(v))*Math.cos(u),
        r*Math.sin(v),
        (R+r*Math.cos(v))*Math.sin(u)
      )
    );
  }

  return normalise(pts,SIZE);
}


function knot(n){

  const pts=[];

  for(let i=0;i<n;i++){

    const t=Math.random()*Math.PI*2;
    const p=2;
    const q=3;

    const rr=2+Math.cos(q*t);

    const base=V(
      rr*Math.cos(p*t),
      rr*Math.sin(p*t),
      Math.sin(q*t)
    ).multiplyScalar(9);

    const j=V(
      Math.random()-.5,
      Math.random()-.5,
      Math.random()-.5
    ).multiplyScalar(5);

    pts.push(base.add(j));
  }

  return normalise(pts,SIZE);
}


function blackHole(n){

  const pts=[];
  const disk=Math.floor(n*.78);
  const ring=disk+Math.floor(n*.07);

  for(let i=0;i<n;i++){

    const a=Math.random()*Math.PI*2;

    if(i<disk){

      const r=12+18*Math.pow(Math.random(),2);

      const y=
        (Math.random()+
        Math.random()+
        Math.random()-1.5)*
        (.8+r*.05);

      pts.push(
        V(
          Math.cos(a)*r,
          y,
          Math.sin(a)*r
        )
      );

    }else if(i<ring){

      const r=10.3+Math.random()*1.2;

      pts.push(
        V(
          Math.cos(a)*r,
          (Math.random()-.5)*.6,
          Math.sin(a)*r
        )
      );

    }else{

      const y=
        (i%2?1:-1)*
        (11+Math.random()*19);

      const rr=
        Math.random()*
        (.8+Math.abs(y)*.06);

      pts.push(
        V(
          Math.cos(a)*rr,
          y,
          Math.sin(a)*rr
        )
      );
    }
  }

  return normalise(pts,SIZE);
}


function galaxy(n){

  const pts=[];

  for(let i=0;i<n;i++){

    const r=
      2+30*Math.pow(Math.random(),.6);

    const a=
      r*.2+
      (i%3)*2.0944+
      (Math.random()-.5)*.9;

    const y=
      (Math.random()-.5)*
      Math.max(1,6-r*.15);

    pts.push(
      V(
        Math.cos(a)*r,
        y,
        Math.sin(a)*r
      )
    );
  }

  return normalise(pts,SIZE);
}


function moon(n){

  const craters=[];

  for(let j=0;j<18;j++){

    const u=Math.random()*2-1;
    const p=Math.random()*Math.PI*2;
    const q=Math.sqrt(1-u*u);

    craters.push({
      dir:V(
        q*Math.cos(p),
        u,
        q*Math.sin(p)
      ),
      rho:.1+Math.random()*.22,
      depth:2+Math.random()*2
    });
  }

  const pts=[];

  for(let i=0;i<n;i++){

    const y=1-2*(i+.5)/n;
    const q=Math.sqrt(1-y*y);
    const phi=i*2.399963;

    const d=V(
      Math.cos(phi)*q,
      y,
      Math.sin(phi)*q
    );

    let r=20;

    for(const c of craters){

      const t=
        Math.acos(
          Math.min(1,d.dot(c.dir))
        )/c.rho;

      if(t<1){
        r-=c.depth*(1-t*t);
      }

      r+=.8*Math.exp(
        -Math.pow((t-1)/.08,2)
      );
    }

    pts.push(d.multiplyScalar(r));
  }

  return normalise(pts,SIZE);
}


function pulsar(n){

  const pts=[];
  const core=Math.floor(n*.1);
  const al=.6;

  const ax=V(
    Math.sin(al),
    Math.cos(al),
    0
  );

  for(let i=0;i<n;i++){

    if(i<core){

      const u=Math.random()*2-1;
      const p=Math.random()*Math.PI*2;
      const q=Math.sqrt(1-u*u);

      pts.push(
        V(
          q*Math.cos(p),
          u,
          q*Math.sin(p)
        ).multiplyScalar(
          4*Math.cbrt(Math.random())
        )
      );

    }else{

      const sgn=i%2?1:-1;
      const d=5+25*Math.pow(Math.random(),.8);

      const rv=V(
        Math.random()-.5,
        Math.random()-.5,
        Math.random()-.5
      ).normalize();

      rv.addScaledVector(
        ax,
        -rv.dot(ax)
      ).normalize().multiplyScalar(
        (.3+d*.07)*Math.sqrt(Math.random())
      );

      pts.push(
        ax.clone().multiplyScalar(sgn*d).add(rv)
      );
    }
  }

  return normalise(pts,SIZE);
}


function saturn(n){

  const pts=[];
  const planeta=Math.floor(n*.45);
  const Rp=18.5;

  for(let i=0;i<n;i++){

    if(i<planeta){

      const y=1-2*(i+.5)/planeta;
      const q=Math.sqrt(1-y*y);
      const phi=i*2.399963;

      pts.push(
        V(
          Math.cos(phi)*q,
          y*.92,
          Math.sin(phi)*q
        ).multiplyScalar(Rp)
      );

    }else{

      let r;

      do{
        r=23+19*Math.random();
      }while(r>36&&r<37.5);

      const a=Math.random()*Math.PI*2;

      pts.push(
        V(
          Math.cos(a)*r,
          (Math.random()-.5)*.5,
          Math.sin(a)*r
        )
      );
    }
  }

  return normalise(pts,84);
}


/* =========================================================
   NUEVAS FORMAS
========================================================= */


/* ☀️ SOL */

function sun(n){

  const pts=[];
  const core=Math.floor(n*.55);

  for(let i=0;i<n;i++){

    if(i<core){

      const u=Math.random()*2-1;
      const p=Math.random()*Math.PI*2;
      const q=Math.sqrt(1-u*u);

      const r=18*Math.cbrt(Math.random());

      pts.push(
        V(
          q*Math.cos(p),
          u,
          q*Math.sin(p)
        ).multiplyScalar(r)
      );

    }else{

      const a=Math.random()*Math.PI*2;
      const r=19+Math.random()*14;
      const y=(Math.random()-.5)*3;

      pts.push(
        V(
          Math.cos(a)*r,
          y,
          Math.sin(a)*r
        )
      );
    }
  }

  return normalise(pts,SIZE);
}


/* 🌍 TIERRA */

function earth(n){

  const pts=[];

  for(let i=0;i<n;i++){

    const y=1-2*(i+.5)/n;
    const r=Math.sqrt(1-y*y);
    const phi=i*2.399963;

    let radius=20;

    /* continentes simulados */

    const noise=
      Math.sin(phi*3.1+y*8)+
      Math.sin(phi*7-y*4)+
      Math.sin(phi*13+y*2);

    radius+=noise>1.5?1.2:0;

    pts.push(
      V(
        Math.cos(phi)*r,
        y,
        Math.sin(phi)*r
      ).multiplyScalar(radius)
    );
  }

  return normalise(pts,SIZE);
}


/* 🌑 ECLIPSE */

function eclipse(n){

  const pts=[];
  const ring=Math.floor(n*.75);

  for(let i=0;i<n;i++){

    if(i<ring){

      const a=Math.random()*Math.PI*2;
      const r=18+Math.random()*5;

      pts.push(
        V(
          Math.cos(a)*r,
          (Math.random()-.5)*1.4,
          Math.sin(a)*r
        )
      );

    }else{

      const u=Math.random()*2-1;
      const p=Math.random()*Math.PI*2;
      const q=Math.sqrt(1-u*u);

      pts.push(
        V(
          q*Math.cos(p),
          u,
          q*Math.sin(p)
        ).multiplyScalar(9)
      );
    }
  }

  return normalise(pts,SIZE);
}


/* ⭐ ESTRELLA */

function star(n){

  const pts=[];

  for(let i=0;i<n;i++){

    const u=Math.random()*2-1;
    const p=Math.random()*Math.PI*2;
    const q=Math.sqrt(1-u*u);

    const spikes=
      .65+
      .35*Math.pow(
        Math.abs(Math.sin(p*5)),
        2
      );

    const r=
      (8+22*Math.random())*
      spikes;

    pts.push(
      V(
        q*Math.cos(p),
        u,
        q*Math.sin(p)
      ).multiplyScalar(r)
    );
  }

  return normalise(pts,SIZE);
}


/* 💥 SUPERNOVA */

function supernova(n){

  const pts=[];

  for(let i=0;i<n;i++){

    const a=Math.random()*Math.PI*2;
    const u=Math.random()*2-1;
    const q=Math.sqrt(1-u*u);

    const r=
      4+
      32*Math.pow(Math.random(),.45);

    const wave=
      1+
      .35*Math.sin(r*.8);

    pts.push(
      V(
        q*Math.cos(a),
        u,
        q*Math.sin(a)
      ).multiplyScalar(r*wave)
    );
  }

  return normalise(pts,SIZE);
}


/* 🌀 AGUJERO DE GUSANO */

function wormhole(n){

  const pts=[];

  for(let i=0;i<n;i++){

    const t=Math.random()*Math.PI*8;

    const radius=
      5+
      Math.random()*17;

    const z=
      (t/(Math.PI*8)-.5)*42;

    const twist=t+z*.35;

    pts.push(
      V(
        Math.cos(twist)*radius,
        Math.sin(twist)*radius,
        z
      )
    );
  }

  return normalise(pts,SIZE);
}


/* ⚛️ ÁTOMO */

function atom(n){

  const pts=[];
  const nucleus=Math.floor(n*.2);

  for(let i=0;i<n;i++){

    if(i<nucleus){

      const u=Math.random()*2-1;
      const p=Math.random()*Math.PI*2;
      const q=Math.sqrt(1-u*u);

      pts.push(
        V(
          q*Math.cos(p),
          u,
          q*Math.sin(p)
        ).multiplyScalar(
          5*Math.random()
        )
      );

    }else{

      const orbit=i%3;
      const a=Math.random()*Math.PI*2;
      const r=22;

      let x,y,z;

      if(orbit===0){
        x=Math.cos(a)*r;
        y=Math.sin(a)*r;
        z=0;
      }else if(orbit===1){
        x=Math.cos(a)*r;
        z=Math.sin(a)*r;
        y=0;
      }else{
        y=Math.cos(a)*r;
        z=Math.sin(a)*r;
        x=0;
      }

      pts.push(
        V(x,y,z)
      );
    }
  }

  return normalise(pts,SIZE);
}


/* 🧿 OJO */

function eye(n){

  const pts=[];
  const iris=Math.floor(n*.72);

  for(let i=0;i<n;i++){

    if(i<iris){

      const a=Math.random()*Math.PI*2;
      const r=5+Math.random()*15;

      pts.push(
        V(
          Math.cos(a)*r,
          (Math.random()-.5)*r*.35,
          Math.sin(a)*r*.45
        )
      );

    }else{

      const a=Math.random()*Math.PI*2;
      const r=18+Math.random()*5;

      pts.push(
        V(
          Math.cos(a)*r,
          Math.sin(a)*r*.3,
          Math.sin(a)*r
        )
      );
    }
  }

  return normalise(pts,SIZE);
}


/* 🧠 CEREBRO */

function brain(n){

  const pts=[];

  for(let i=0;i<n;i++){

    const side=i%2===0?1:-1;

    const t=Math.random()*Math.PI*2;

    const x=
      side*
      (4+
      Math.abs(Math.sin(t*5))*12+
      Math.random()*5);

    const y=
      Math.sin(t*2.5)*13+
      (Math.random()-.5)*7;

    const z=
      Math.cos(t*3)*12+
      (Math.random()-.5)*5;

    pts.push(
      V(x,y,z)
    );
  }

  return normalise(pts,SIZE);
}


/* 🌀 PORTAL DIMENSIONAL */

function portal(n){

  const pts=[];

  for(let i=0;i<n;i++){

    const t=Math.random()*Math.PI*2*7;

    const r=
      8+
      15*Math.pow(
        Math.abs(Math.sin(t*.5)),
        .7
      );

    const z=
      Math.sin(t*2)*7;

    pts.push(
      V(
        Math.cos(t)*r,
        Math.sin(t)*r,
        z
      )
    );
  }

  return normalise(pts,SIZE);
}


/* 💥 EXPLOSIÓN */

function explosion(n){

  const pts=[];

  for(let i=0;i<n;i++){

    const a=Math.random()*Math.PI*2;
    const u=Math.random()*2-1;
    const q=Math.sqrt(1-u*u);

    const r=
      4+
      Math.pow(Math.random(),.35)*35;

    const pulse=
      1+
      .25*Math.sin(r*1.7);

    pts.push(
      V(
        q*Math.cos(a),
        u,
        q*Math.sin(a)
      ).multiplyScalar(r*pulse)
    );
  }

  return normalise(pts,SIZE);
}


/* 🌌 NEBULOSA */

function nebula(n){

  const pts=[];

  for(let i=0;i<n;i++){

    const arm=i%4;

    const r=
      3+
      30*Math.random();

    const a=
      r*.18+
      arm*Math.PI/2+
      (Math.random()-.5)*1.2;

    const y=
      (Math.random()-.5)*
      (3+r*.12);

    pts.push(
      V(
        Math.cos(a)*r,
        y,
        Math.sin(a)*r
      )
    );
  }

  return normalise(pts,SIZE);
}


/* 🕸️ RED NEURONAL */

function neural(n){

  const pts=[];

  const nodes=[];

  for(let i=0;i<25;i++){

    nodes.push(
      V(
        (Math.random()-.5)*45,
        (Math.random()-.5)*45,
        (Math.random()-.5)*45
      )
    );
  }

  for(let i=0;i<n;i++){

    const a=nodes[
      Math.floor(Math.random()*nodes.length)
    ];

    const b=nodes[
      Math.floor(Math.random()*nodes.length)
    ];

    const t=Math.random();

    const p=a.clone().lerp(b,t);

    p.add(
      V(
        (Math.random()-.5)*2,
        (Math.random()-.5)*2,
        (Math.random()-.5)*2
      )
    );

    pts.push(p);
  }

  return normalise(pts,SIZE);
}


/* 🧬 MOLÉCULA */

function molecule(n){

  const pts=[];
  const atoms=12;

  const centers=[];

  for(let i=0;i<atoms;i++){

    const a=i*Math.PI*2/atoms;

    centers.push(
      V(
        Math.cos(a)*22,
        Math.sin(a*2)*7,
        Math.sin(a)*22
      )
    );
  }

  for(let i=0;i<n;i++){

    if(i%4===0){

      const c=
        centers[
          Math.floor(Math.random()*centers.length)
        ];

      const u=Math.random()*2-1;
      const p=Math.random()*Math.PI*2;
      const q=Math.sqrt(1-u*u);

      pts.push(
        c.clone().add(
          V(
            q*Math.cos(p),
            u,
            q*Math.sin(p)
          ).multiplyScalar(
            2+Math.random()*2
          )
        )
      );

    }else{

      const a=
        centers[
          Math.floor(Math.random()*centers.length)
        ];

      const b=
        centers[
          Math.floor(Math.random()*centers.length)
        ];

      pts.push(
        a.clone().lerp(
          b,
          Math.random()
        )
      );
    }
  }

  return normalise(pts,SIZE);
}


/* 🔮 CRISTAL ENERGÉTICO */

function crystal(n){

  const pts=[];

  for(let i=0;i<n;i++){

    const side=i%6;

    const t=Math.random()*2-1;

    const r=
      (1-Math.abs(t))*20+
      3;

    let x,y,z;

    if(side===0){
      x=t*20;
      y=(Math.random()-.5)*r;
      z=(Math.random()-.5)*r;
    }else if(side===1){
      y=t*20;
      x=(Math.random()-.5)*r;
      z=(Math.random()-.5)*r;
    }else{
      z=t*20;
      x=(Math.random()-.5)*r;
      y=(Math.random()-.5)*r;
    }

    pts.push(V(x,y,z));
  }

  return normalise(pts,SIZE);
}

let modo="repeler";
let down=false;
let act=false;

let lx=0;
let ly=0;

let baseZ=95;
let zoom=1;
let camZ=95;

let pinchD=0;

const ndc=
  new THREE.Vector2();

const rayo=
  new THREE.Raycaster();

const inv=
  new THREE.Matrix4();

const punteros=
  new Map();


const ndcDe=e=>
  ndc.set(
    e.clientX/innerWidth*2-1,
    -(e.clientY/innerHeight*2-1)
  );


const distPinch=()=>{

  const [a,b]=[
    ...punteros.values()
  ];

  return Math.hypot(
    a.clientX-b.clientX,
    a.clientY-b.clientY
  );
};


const limitar=z=>
  Math.min(
    2.2,
    Math.max(.4,z)
  );


canvas.addEventListener(
  "pointerdown",
  e=>{

    canvas.setPointerCapture(
      e.pointerId
    );

    punteros.set(
      e.pointerId,
      e
    );

    ndcDe(e);

    lx=e.clientX;
    ly=e.clientY;

    if(punteros.size===2){

      pinchD=distPinch();

      down=false;
      act=false;

    }else{

      down=
        modo==="girar";

      act=
        modo!=="girar";
    }

    canvas.style.cursor=
      down
      ?"grabbing"
      :"grab";
  }
);


canvas.addEventListener(
  "pointermove",
  e=>{

    ndcDe(e);

    if(punteros.has(e.pointerId)){
      punteros.set(
        e.pointerId,
        e
      );
    }

    if(punteros.size===2){

      const d=distPinch();

      if(pinchD>0){
        zoom=
          limitar(
            zoom*pinchD/d
          );
      }

      pinchD=d;

      return;
    }

    if(
      e.pointerType==="mouse" &&
      !punteros.size
    ){
      act=modo!=="girar";
    }

    if(down){

      points.rotation.y+=
        (e.clientX-lx)*.006;

      points.rotation.x+=
        (e.clientY-ly)*.006;

      lx=e.clientX;
      ly=e.clientY;
    }
  }
);


const soltar=e=>{

  punteros.delete(
    e.pointerId
  );

  pinchD=0;
  down=false;

  if(
    e.pointerType!=="mouse" ||
    modo==="girar"
  ){
    act=false;
  }

  canvas.style.cursor="grab";
};


canvas.addEventListener(
  "pointerup",
  soltar
);

canvas.addEventListener(
  "pointercancel",
  soltar
);

canvas.addEventListener(
  "pointerleave",
  e=>{
    if(e.pointerType==="mouse"){
      act=false;
    }
  }
);


canvas.addEventListener(
  "wheel",
  e=>{

    e.preventDefault();

    zoom=
      limitar(
        zoom*
        Math.exp(e.deltaY*.001)
      );

  },
  {passive:false}
);

  const sh=
    shapes[actual];

  /* Cámara */

  camZ+=
    (
      baseZ*
      zoom*
      (sh.cam||1)
      -
      camZ
    )*.15;

  camera.position.z=
    camZ;


  /* Órbitas */

  const ob=
    (sh.orbit&&!reduce)
    ?
    sh.orbitN
    :
    0;

  const inf=
    (sh.infall&&!reduce)
    ?
    sh.infallN
    :
    0;

  let ratio=1;


  /* Rotación especial */

  const e=
    sh.rigid
    ?
    new THREE.Matrix4()
      .makeRotationFromEuler(
        new THREE.Euler(
          sh.orbit*.7*
          Math.sin(t*.9),

          sh.orbit,

          sh.orbit*.7*
          Math.cos(t*.6)
        )
      ).elements
    :
    null;


  /* Agujero negro */

  if(
    sh.hole &&
    !reduce
  ){

    g=
      Math.min(
        1,
        g+1/360
      );

    const nh=
      1+.3*g;

    ratio=
      nh/hsc;

    hsc=nh;
  }


  /* =====================================================
     ANIMACIONES ESPECIALES
  ===================================================== */

  let specialScale=1;

  if(!reduce){

    if(sh.special==="sun"){

      specialScale=
        1+
        Math.sin(t*2.2)*.035;

    }

    if(sh.special==="star"){

      specialScale=
        1+
        Math.sin(t*3.5)*.08;

    }

    if(sh.special==="supernova"){

      specialScale=
        1+
        Math.sin(t*1.8)*.12;

    }

    if(sh.special==="explosion"){

      specialScale=
        1+
        Math.sin(t*2.5)*.18;

    }

    if(sh.special==="portal"){

      points.rotation.z+=.012;

      specialScale=
        1+
        Math.sin(t*2)*.04;
    }

    if(sh.special==="wormhole"){

      points.rotation.z+=.008;

      specialScale=
        1+
        Math.sin(t*2.5)*.05;
    }

    if(sh.special==="atom"){

      points.rotation.x+=.006;
      points.rotation.z+=.004;
    }

    if(sh.special==="neural"){

      specialScale=
        1+
        Math.sin(t*2)*.025;
    }

    if(sh.special==="crystal"){

      specialScale=
        1+
        Math.sin(t*2.8)*.07;
    }
  }


  /* =====================================================
     PARTÍCULAS
  ===================================================== */

  for(let i=0;i<N;i++){

    const k=i*3;
    const s=speed[i];


    /* Rotación */

    if(i<ob && e){

      for(
        const arr of
        [target,pos]
      ){

        const x=arr[k];
        const y=arr[k+1];
        const z=arr[k+2];

        arr[k]=
          e[0]*x+
          e[4]*y+
          e[8]*z;

        arr[k+1]=
          e[1]*x+
          e[5]*y+
          e[9]*z;

        arr[k+2]=
          e[2]*x+
          e[6]*y+
          e[10]*z;
      }

    }else if(i<ob){

      const x=target[k];
      const z=target[k+2];

      const r0=
        Math.hypot(x,z);

      const a=
        i<(sh.spinN||0)
        ?
        sh.spin
        :
        sh.orbit*
        Math.pow(
          20/(r0+3),
          1.5
        );

      const cs=Math.cos(a);
      const sn=Math.sin(a);

      let nx=
        x*cs-z*sn;

      let nz=
        x*sn+z*cs;


      /* Caída al agujero negro */

      if(i<inf){

        const f=
          1-
          sh.infall*
          Math.pow(
            30/r0,
            1.2
          );

        const r=r0*f;

        nx*=f;
        nz*=f;


        if(
          r<
          11.5*hsc
        ){

          const ang=
            Math.random()*6.2832;

          const rr=
            24+
            Math.random()*6;

          nx=
            Math.cos(ang)*rr;

          nz=
            Math.sin(ang)*rr;

          target[k+1]=
            pos[k+1]=
              (
                Math.random()+
                Math.random()+
                Math.random()-
                1.5
              )*
              (.8+rr*.05);

          pos[k]=nx;
          pos[k+2]=nz;

          col[k]=bh[0];
          col[k+1]=bh[1];
          col[k+2]=bh[2];
        }

        const tt=
          Math.min(
            Math.max(
              (30-r)/19,
              0
            ),
            1
          );

        colT[k]=
          bh[0]+
          (1-bh[0])*tt;

        colT[k+1]=
          bh[1]+
          (1-bh[1])*tt;

        colT[k+2]=
          bh[2]+
          (1-bh[2])*
          tt*tt;

      }else if(ratio!==1){

        nx*=ratio;
        nz*=ratio;
      }


      target[k]=nx;
      target[k+2]=nz;


      if(sh.rigid){

        const px=pos[k];
        const pz=pos[k+2];

        pos[k]=
          px*cs-pz*sn;

        pos[k+2]=
          px*sn+pz*cs;
      }
    }


    /* Escala especial */

    if(
      sh.special &&
      !reduce
    ){

      target[k]*=specialScale;
      target[k+1]*=specialScale;
      target[k+2]*=specialScale;
    }


    /* Interpolación */

    pos[k]+=
      (target[k]-pos[k])*s;

    pos[k+1]+=
      (target[k+1]-pos[k+1])*s;

    pos[k+2]+=
      (target[k+2]-pos[k+2])*s;


    /* Color */

    col[k]+=
      (colT[k]-col[k])*.04;

    col[k+1]+=
      (colT[k+1]-col[k+1])*.04;

    col[k+2]+=
      (colT[k+2]-col[k+2])*.04;
  }


  /* =====================================================
     INTERACCIÓN CON EL CURSOR
  ===================================================== */

  if(act){

    points.updateMatrixWorld(true);

    inv.copy(
      points.matrixWorld
    ).invert();

    rayo.setFromCamera(
      ndc,
      camera
    );

    const o=
      rayo.ray.origin.clone()
      .applyMatrix4(inv);

    const d=
      rayo.ray.direction.clone()
      .transformDirection(inv);

    const R=12;

    const rep=
      modo==="repeler";


    for(let i=0;i<N;i++){

      const k=i*3;

      const vx=
        pos[k]-o.x;

      const vy=
        pos[k+1]-o.y;

      const vz=
        pos[k+2]-o.z;

      const tt=
        vx*d.x+
        vy*d.y+
        vz*d.z;

      const px=
        vx-d.x*tt;

      const py=
        vy-d.y*tt;

      const pz=
        vz-d.z*tt;

      const dist=
        Math.sqrt(
          px*px+
          py*py+
          pz*pz
        );


      if(dist<R){

        const f=
          1-dist/R;

        const w=
          rep
          ?
          .5*f*f/(dist+.3)
          :
          -.05*f;

        pos[k]+=
          px*w;

        pos[k+1]+=
          py*w;

        pos[k+2]+=
          pz*w;
      }
    }
  }


  /* =====================================================
     ACTUALIZAR
  ===================================================== */

  geo.attributes
    .position
    .needsUpdate=true;

  geo.attributes
    .color
    .needsUpdate=true;


  /* Agujero central */

  holeS+=
    (holeT-holeS)*.06;

  hole.scale.setScalar(
    Math.max(
      holeS*hsc,
      .001
    )
  );


  /* Inclinación inicial */

  if(
    !down &&
    performance.now()<tiltUntil
  ){

    points.rotation.x+=
      (tilt-
       points.rotation.x)*.04;
  }


  /* Rotación automática */

  if(
    !down &&
    !reduce
  ){

    points.rotation.y+=.004;
  }


  /* Pulso general */

  points.scale.setScalar(
    1+
    Math.sin(t*1.2)*.02
  );


  /* Render */

  if(composer){

    composer.render();

  }else{

    renderer.render(
      scene,
      camera
    );
  }
}


animar();

</script>
