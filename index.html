<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partículas Metamórficas 3D</title>
<meta name="description" content="Simulación interactiva de partículas metamórficas 3D creada con Three.js">

<!-- Open Graph / Redes Sociales -->
<meta property="og:title" content="Partículas Metamórficas 3D">
<meta property="og:description" content="Experiencia visual e interactiva 3D en tiempo real con WebGL.">
<meta property="og:type" content="website">

<style>
:root{--bg:#000;--fg:#e8f0ff;--accent:#1f6bff;--muted:#7f8aa3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#e8f0ff}}
:root[data-theme="dark"]{--bg:#000;--fg:#e8f0ff}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#marca{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:18px;font-weight:700;letter-spacing:.02em;pointer-events:none;z-index:10}
#marca small{display:block;font-weight:400;color:var(--muted);font-size:.78rem;margin-top:2px}
button{font:inherit;font-size:.9rem;color:var(--fg);background:rgba(31,107,255,.12);border:1px solid rgba(31,107,255,.45);border-radius:999px;padding:9px 16px;cursor:pointer;transition:background .2s,border-color .2s}
button:hover{background:rgba(31,107,255,.3)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
button.on{background:var(--accent);border-color:var(--accent)}
[hidden]{display:none !important}
#ui{transition:opacity .6s}
#ui.oculta{opacity:0;pointer-events:none}
.glass{background:rgba(8,12,26,.62);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(31,107,255,.35)}
#barra{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;z-index:10}
#barra button{background:transparent;border-color:transparent}
#barra button:hover{background:rgba(31,107,255,.25)}
#prev,#next{width:40px;height:40px;padding:0;font-size:1.3rem;line-height:1}
#nombre{min-width:150px}
#menu{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 76px);display:flex;flex-direction:column;gap:4px;padding:8px;border-radius:16px;z-index:10;max-height:50vh;overflow-y:auto}
#menu button{text-align:left;border-radius:10px;white-space:nowrap}
#ajustes{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:42px;height:42px;padding:0;border-radius:50%;font-size:1.15rem;z-index:10}
#panel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);right:12px;width:min(280px,calc(100vw - 24px));padding:14px;border-radius:16px;display:flex;flex-direction:column;gap:10px;z-index:10}
#panel p{margin:0;font-size:.82rem;color:var(--muted)}
#modos,#colores{display:flex;gap:8px;flex-wrap:wrap}
#modos button{padding:6px 11px;font-size:.8rem}
input[type=range]{width:100%;accent-color:var(--accent)}
.sw{width:26px;height:26px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:var(--c) !important}
.sw:hover,.sw.on{border-color:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="marca">Mi Proyecto 3D<small>Partículas Interactivas</small></div>
<div id="ui">
  <button id="ajustes" class="glass" aria-label="Ajustes">⚙</button>
  <div id="panel" class="glass" hidden>
    <p>Al tocar la pantalla</p>
    <div id="modos"></div>
    <p>Color</p>
    <div id="colores"></div>
    <div id="filaBrillo"><p>Brillo</p><input type="range" id="brillo" min="0" max="2" step="0.05" value="0.9" aria-label="Brillo"></div>
    <p>Pellizcá o usá la rueda para hacer zoom.</p>
  </div>
  <div id="menu" class="glass" hidden></div>
  <div id="barra" class="glass">
    <button id="prev" aria-label="Forma anterior">‹</button>
    <button id="nombre" aria-haspopup="true">Hélice</button>
    <button id="next" aria-label="Forma siguiente">›</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
// Adaptar densidad según el dispositivo para optimizar rendimiento
const esMovil = /Android|iPhone|iPad/i.test(navigator.userAgent);
const N = esMovil ? 9000 : 15000, SIZE = 60;

function normalise(pts, size) {
  let max = 0;
  for (const p of pts) max = Math.max(max, p.length());
  const k = (size / 2) / (max || 1);
  return pts.map(p => p.multiplyScalar(k));
}

function dualHelix(n) {
  const pts = [], turns = 5, radius = 15, height = 40;
  for (let i = 0; i < n; i++) {
    const second = i % 2 === 0;
    const angle = (i / n) * Math.PI * 2 * turns;
    const y = (i / n) * height - height / 2;
    const r = radius + (second ? 5 : -5);
    pts.push(new THREE.Vector3(Math.cos(angle) * r, y, Math.sin(angle) * r));
  }
  return normalise(pts, SIZE);
}

// Nueva figura: ADN con puentes conectores
function dnaHelix(n) {
  const pts = [], turns = 6, height = 48, radius = 12;
  const strands = Math.floor(n * 0.7);
  for (let i = 0; i < n; i++) {
    if (i < strands) {
      const strand = i % 2;
      const t = i / strands;
      const angle = t * Math.PI * 2 * turns + (strand * Math.PI);
      const y = t * height - height / 2;
      pts.push(new THREE.Vector3(Math.cos(angle) * radius, y, Math.sin(angle) * radius));
    } else {
      const t = Math.random();
      const angle = Math.floor(t * turns * 2) * (Math.PI / turns);
      const y = t * height - height / 2;
      const r = (Math.random() - 0.5) * radius * 2;
      pts.push(new THREE.Vector3(Math.cos(angle) * r, y, Math.sin(angle) * r));
    }
  }
  return normalise(pts, SIZE);
}

// Nueva figura: Cubo Cuántico / Tesseract
function hypercube(n) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const isInner = i % 2 === 0;
    const side = isInner ? 10 : 22;
    const face = Math.floor(Math.random() * 6);
    let x = (Math.random() - 0.5) * side;
    let y = (Math.random() - 0.5) * side;
    let z = (Math.random() - 0.5) * side;
    
    if (face === 0) x = side / 2;
    else if (face === 1) x = -side / 2;
    else if (face === 2) y = side / 2;
    else if (face === 3) y = -side / 2;
    else if (face === 4) z = side / 2;
    else if (face === 5) z = -side / 2;
    
    pts.push(new THREE.Vector3(x, y, z));
  }
  return normalise(pts, SIZE);
}

function sphere(n) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const y = 1 - 2 * (i + 0.5) / n, r = Math.sqrt(1 - y * y), phi = i * 2.399963;
    pts.push(new THREE.Vector3(Math.cos(phi) * r, y, Math.sin(phi) * r).multiplyScalar(20));
  }
  return normalise(pts, SIZE);
}

function torus(n) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const u = Math.random() * Math.PI * 2, v = Math.random() * Math.PI * 2;
    const R = 20, r = 7 + Math.random() * 2;
    pts.push(new THREE.Vector3((R + r * Math.cos(v)) * Math.cos(u), r * Math.sin(v), (R + r * Math.cos(v)) * Math.sin(u)));
  }
  return normalise(pts, SIZE);
}

function knot(n) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const t = Math.random() * Math.PI * 2, p = 2, q = 3;
    const rr = 2 + Math.cos(q * t);
    const base = new THREE.Vector3(rr * Math.cos(p * t), rr * Math.sin(p * t), Math.sin(q * t)).multiplyScalar(9);
    const j = new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).multiplyScalar(5);
    pts.push(base.add(j));
  }
  return normalise(pts, SIZE);
}

const V = (x, y, z) => new THREE.Vector3(x, y, z);

function blackHole(n) {
  const pts = [], disk = Math.floor(n * 0.78), ring = disk + Math.floor(n * 0.07);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    if (i < disk) {
      const r = 12 + 18 * Math.pow(Math.random(), 2);
      const y = (Math.random() + Math.random() + Math.random() - 1.5) * (0.8 + r * 0.05);
      pts.push(V(Math.cos(a) * r, y, Math.sin(a) * r));
    } else if (i < ring) {
      const r = 10.3 + Math.random() * 1.2;
      pts.push(V(Math.cos(a) * r, (Math.random() - 0.5) * 0.6, Math.sin(a) * r));
    } else {
      const y = (i % 2 ? 1 : -1) * (11 + Math.random() * 19);
      const rr = Math.random() * (0.8 + Math.abs(y) * 0.06);
      pts.push(V(Math.cos(a) * rr, y, Math.sin(a) * rr));
    }
  }
  return normalise(pts, SIZE);
}

function galaxy(n) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const r = 2 + 30 * Math.pow(Math.random(), 0.6);
    const a = r * 0.2 + (i % 3) * 2.0944 + (Math.random() - 0.5) * 0.9;
    const y = (Math.random() - 0.5) * Math.max(1, 6 - r * 0.15);
    pts.push(V(Math.cos(a) * r, y, Math.sin(a) * r));
  }
  return normalise(pts, SIZE);
}

function moon(n) {
  const craters = [];
  for (let j = 0; j < 18; j++) {
    const u = Math.random() * 2 - 1, p = Math.random() * Math.PI * 2, q = Math.sqrt(1 - u * u);
    craters.push({ dir: V(q * Math.cos(p), u, q * Math.sin(p)), rho: 0.1 + Math.random() * 0.22, depth: 2 + Math.random() * 2 });
  }
  const pts = [];
  for (let i = 0; i < n; i++) {
    const y = 1 - 2 * (i + 0.5) / n, q = Math.sqrt(1 - y * y), phi = i * 2.399963;
    const d = V(Math.cos(phi) * q, y, Math.sin(phi) * q);
    let r = 20;
    for (const c of craters) {
      const t = Math.acos(Math.min(1, d.dot(c.dir))) / c.rho;
      if (t < 1) r -= c.depth * (1 - t * t);
      r += 0.8 * Math.exp(-Math.pow((t - 1) / 0.08, 2));
    }
    pts.push(d.multiplyScalar(r));
  }
  return normalise(pts, SIZE);
}

function pulsar(n) {
  const pts = [], core = Math.floor(n * 0.1), al = 0.6;
  const ax = V(Math.sin(al), Math.cos(al), 0);
  for (let i = 0; i < n; i++) {
    if (i < core) {
      const u = Math.random() * 2 - 1, p = Math.random() * Math.PI * 2, q = Math.sqrt(1 - u * u);
      pts.push(V(q * Math.cos(p), u, q * Math.sin(p)).multiplyScalar(4 * Math.cbrt(Math.random())));
    } else {
      const sgn = i % 2 ? 1 : -1, d = 5 + 25 * Math.pow(Math.random(), 0.8);
      const rv = V(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
      rv.addScaledVector(ax, -rv.dot(ax)).normalize().multiplyScalar((0.3 + d * 0.07) * Math.sqrt(Math.random()));
      pts.push(ax.clone().multiplyScalar(sgn * d).add(rv));
    }
  }
  return normalise(pts, SIZE);
}

function saturn(n) {
  const pts = [], planeta = Math.floor(n * 0.45), Rp = 18.5;
  for (let i = 0; i < n; i++) {
    if (i < planeta) {
      const y = 1 - 2 * (i + 0.5) / planeta, q = Math.sqrt(1 - y * y), phi = i * 2.399963;
      pts.push(V(Math.cos(phi) * q, y * 0.92, Math.sin(phi) * q).multiplyScalar(Rp));
    } else {
      let r;
      do { r = 23 + 19 * Math.random(); } while (r > 36 && r < 37.5);
      const a = Math.random() * Math.PI * 2;
      pts.push(V(Math.cos(a) * r, (Math.random() - 0.5) * 0.5, Math.sin(a) * r));
    }
  }
  return normalise(pts, 84);
}

const shapes = [
  { nombre: "Hélice", pts: dualHelix(N), hue: [0.55, 0.75] },
  { nombre: "ADN", pts: dnaHelix(N), hue: [0.28, 0.45] },
  { nombre: "Cubo Cuántico", pts: hypercube(N), hue: [0.8, 0.95], glow: true },
  { nombre: "Esfera", pts: sphere(N), hue: [0.5, 0.62] },
  { nombre: "Toro",   pts: torus(N), hue: [0.58, 0.72] },
  { nombre: "Nudo",   pts: knot(N), hue: [0.62, 0.85] },
  { nombre: "Agujero negro", pts: blackHole(N), hue: [0.03, 0.12], glow: true, orbit: 0.006, orbitN: Math.floor(N * 0.85), infall: 0.0025, infallN: Math.floor(N * 0.78), hole: true, tilt: 0.75, dwell: 9000 },
  { nombre: "Galaxia", pts: galaxy(N), hue: [0.6, 0.9], glow: true, orbit: 0.003, orbitN: N, tilt: 0.6 },
  { nombre: "Luna", pts: moon(N), hue: [0.1, 0.14], sat: 0.12, light: (p, r) => (Math.sin(p.x * 0.22 + 1) * Math.cos(p.y * 0.2) + Math.sin(p.z * 0.25) > 1 ? 0.3 : 0.5) + 0.35 * r },
  { nombre: "Pulsar", pts: pulsar(N), hue: [0.53, 0.6], glow: true, orbit: 0.3, rigid: true, orbitN: N, tilt: 0.25, dwell: 7000 },
  { nombre: "Saturno", pts: saturn(N), hue: [0.08, 0.12], sat: 0.6, orbit: 0.02, orbitN: N, spin: 0.012, spinN: Math.floor(N * 0.45), occl: 1.9, cam: 1.2, tilt: 0.45,
    light: (p, r) => {
      const rho = Math.hypot(p.x, p.z);
      if (Math.abs(p.y) < 1 && rho > 22) return Math.max(0.15, 0.42 + 0.22 * Math.sin(rho * 1.6) + 0.15 * r);
      return 0.42 + 0.14 * Math.sin(p.y * 0.55) + 0.1 * Math.sin(3 * Math.atan2(p.z, p.x) + p.y * 0.3) + 0.12 * r;
    } }
];

// Escena
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 500);
camera.position.z = 95;

const pos = new Float32Array(N * 3), col = new Float32Array(N * 3), speed = new Float32Array(N);
const target = new Float32Array(N * 3);
const colT = new Float32Array(N * 3);
const rnd = new Float32Array(N).map(() => Math.random());
const c = new THREE.Color();
for (let i = 0; i < N; i++) {
  const s = shapes[0].pts[i];
  pos.set([s.x, s.y, s.z], i * 3);
  speed[i] = 0.015 + Math.random() * 0.05;
  c.setHSL(0.58 + Math.random() * 0.2, 0.9, 0.5 + Math.random() * 0.35);
  col.set([c.r, c.g, c.b], i * 3);
}
const geo = new THREE.BufferGeometry();
geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
const points = new THREE.Points(geo, new THREE.PointsMaterial({
  size: 0.55, vertexColors: true, transparent: true, opacity: 0.9,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
scene.add(points);

const hole = new THREE.Mesh(new THREE.SphereGeometry(9.5, 48, 32), new THREE.MeshBasicMaterial({ color: 0x000000 }));
hole.scale.setScalar(0.001);
scene.add(hole);
let holeS = 0, holeT = 0, hsc = 1, g = 0;

let composer = null, bloom = null;
if (THREE.EffectComposer && THREE.RenderPass && THREE.UnrealBloomPass) {
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.9, 0.55, 0.2);
  composer.addPass(bloom);
}

let actual = 0, pausaAuto = 0, tilt = 0, tiltUntil = 0, inicio = 0, tinte = null;
const bh = [1, 0.3, 0.03];
function pintar() {
  const s = shapes[actual], pts = s.pts;
  for (let i = 0; i < N; i++) {
    const d = Math.min(pts[i].length() / (SIZE / 2), 1);
    const h = tinte !== null ? tinte + (rnd[i] - 0.5) * 0.05 : s.hue[0] + (s.hue[1] - s.hue[0]) * rnd[i];
    const l = s.light ? s.light(pts[i], rnd[(i * 7) % N]) : s.glow ? 0.85 - 0.5 * d : 0.5 + 0.35 * rnd[(i * 7) % N];
    c.setHSL(h, tinte !== null ? 0.9 : (s.sat ?? 0.9), l);
    colT.set([c.r, c.g, c.b], i * 3);
  }
}

function irA(k) {
  actual = k;
  const s = shapes[k], pts = s.pts;
  for (let i = 0; i < N; i++) target.set([pts[i].x, pts[i].y, pts[i].z], i * 3);
  pintar();
  tilt = s.tilt || 0;
  holeT = s.hole ? 1 : (s.occl || 0);
  g = 0; hsc = 1; inicio = performance.now();
  tiltUntil = performance.now() + 2500;
  [...menu.children].forEach((b, j) => b.classList.toggle("on", j === k));
  document.getElementById("nombre").textContent = s.nombre;
}

const menu = document.getElementById("menu");
shapes.forEach((s, k) => {
  const b = document.createElement("button");
  b.textContent = s.nombre;
  b.onclick = () => { irA(k); pausaAuto = performance.now() + 8000; menu.hidden = true; };
  menu.appendChild(b);
});
irA(0);
col.set(colT);

let modo = "repeler", down = false, act = false, lx = 0, ly = 0, baseZ = 95, zoom = 1, camZ = 95, pinchD = 0;
const ndc = new THREE.Vector2(), rayo = new THREE.Raycaster(), inv = new THREE.Matrix4();
const punteros = new Map();
const ndcDe = e => ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight * 2 - 1));
const distPinch = () => { const [a, b] = [...punteros.values()]; return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); };
const limitar = z => Math.min(2.2, Math.max(0.4, z));

canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  punteros.set(e.pointerId, e);
  ndcDe(e); lx = e.clientX; ly = e.clientY;
  if (punteros.size === 2) { pinchD = distPinch(); down = false; act = false; }
  else { down = modo === "girar"; act = modo !== "girar"; }
  canvas.style.cursor = down ? "grabbing" : "grab";
});

canvas.addEventListener("pointermove", e => {
  ndcDe(e);
  if (punteros.has(e.pointerId)) punteros.set(e.pointerId, e);
  if (punteros.size === 2) {
    const d = distPinch();
    if (pinchD > 0) zoom = limitar(zoom * pinchD / d);
    pinchD = d;
    return;
  }
  if (e.pointerType === "mouse" && !punteros.size) act = modo !== "girar";
  if (down) {
    points.rotation.y += (e.clientX - lx) * 0.006;
    points.rotation.x += (e.clientY - ly) * 0.006;
    lx = e.clientX; ly = e.clientY;
  }
});

const soltar = e => {
  punteros.delete(e.pointerId); pinchD = 0; down = false;
  if (e.pointerType !== "mouse" || modo === "girar") act = false;
  canvas.style.cursor = "grab";
};
canvas.addEventListener("pointerup", soltar);
canvas.addEventListener("pointercancel", soltar);
canvas.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") act = false; });
canvas.addEventListener("wheel", e => { e.preventDefault(); zoom = limitar(zoom * Math.exp(e.deltaY * 0.001)); }, { passive: false });

const modos = document.getElementById("modos");
[["girar", "Girar"], ["repeler", "Repeler"], ["atraer", "Atraer"]].forEach(([id, txt]) => {
  const b = document.createElement("button");
  b.textContent = txt; b.dataset.id = id;
  b.classList.toggle("on", id === modo);
  b.onclick = () => {
    modo = id; act = false; down = false;
    [...modos.children].forEach(x => x.classList.toggle("on", x.dataset.id === id));
  };
  modos.appendChild(b);
});

const colores = document.getElementById("colores");
[[null, "Original"], [0.61, "Azul"], [0.5, "Cian"], [0.36, "Verde"], [0.13, "Dorado"], [0.99, "Rojo"], [0.8, "Violeta"]].forEach(([h, nombre], j) => {
  const b = document.createElement("button");
  b.className = "sw" + (j === 0 ? " on" : "");
  b.title = nombre; b.setAttribute("aria-label", "Color " + nombre);
  b.style.setProperty("--c", h === null ? "conic-gradient(#f44,#fc4,#4f8,#4cf,#84f,#f44)" : `hsl(${h * 360} 90% 55%)`);
  b.onclick = () => {
    tinte = h;
    if (h === null) bh.splice(0, 3, 1, 0.3, 0.03);
    else { c.setHSL(h, 0.95, 0.5); bh.splice(0, 3, c.r, c.g, c.b); }
    pintar();
    [...colores.children].forEach((x, i) => x.classList.toggle("on", i === j));
  };
  colores.appendChild(b);
});

const ui = document.getElementById("ui"), panel = document.getElementById("panel");
const paso = d => { irA((actual + d + shapes.length) % shapes.length); pausaAuto = performance.now() + 8000; };
document.getElementById("prev").onclick = () => paso(-1);
document.getElementById("next").onclick = () => paso(1);
document.getElementById("nombre").onclick = () => { panel.hidden = true; menu.hidden = !menu.hidden; };
document.getElementById("ajustes").onclick = () => { menu.hidden = true; panel.hidden = !panel.hidden; };
canvas.addEventListener("pointerdown", () => { panel.hidden = true; menu.hidden = true; });
const brillo = document.getElementById("brillo");
if (bloom) brillo.oninput = () => { bloom.strength = +brillo.value; };
else document.getElementById("filaBrillo").hidden = true;

let idle;
const despertar = () => {
  ui.classList.remove("oculta");
  clearTimeout(idle);
  idle = setTimeout(() => { if (panel.hidden && menu.hidden) ui.classList.add("oculta"); }, 4000);
};
["pointermove", "pointerdown", "keydown"].forEach(ev => addEventListener(ev, despertar));
despertar();

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  if (composer) composer.setSize(w, h);
  camera.aspect = w / h;
  baseZ = w / h < 0.8 ? 130 : 95;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function animar() {
  requestAnimationFrame(animar);
  const t = performance.now() * 0.001;
  camZ += (baseZ * zoom * (shapes[actual].cam || 1) - camZ) * 0.15;
  camera.position.z = camZ;
  const sh = shapes[actual], ob = (sh.orbit && !reduce) ? sh.orbitN : 0, inf = (sh.infall && !reduce) ? sh.infallN : 0;
  let ratio = 1;

  const e = sh.rigid ? new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(sh.orbit * 0.7 * Math.sin(t * 0.9), sh.orbit, sh.orbit * 0.7 * Math.cos(t * 0.6))).elements : null;
  if (sh.hole && !reduce) { g = Math.min(1, g + 1 / 360); const nh = 1 + 0.3 * g; ratio = nh / hsc; hsc = nh; }
  for (let i = 0; i < N; i++) {
    const k = i * 3, s = speed[i];
    if (i < ob && e) {
      for (const arr of [target, pos]) {
        const x = arr[k], y = arr[k + 1], z = arr[k + 2];
        arr[k]     = e[0] * x + e[4] * y + e[8]  * z;
        arr[k + 1] = e[1] * x + e[5] * y + e[9]  * z;
        arr[k + 2] = e[2] * x + e[6] * y + e[10] * z;
      }
    } else if (i < ob) {
      const x = target[k], z = target[k + 2], r0 = Math.hypot(x, z);
      const a = i < (sh.spinN || 0) ? sh.spin : sh.orbit * Math.pow(20 / (r0 + 3), 1.5);
      const cs = Math.cos(a), sn = Math.sin(a);
      let nx = x * cs - z * sn, nz = x * sn + z * cs;
      if (i < inf) {
        const f = 1 - sh.infall * Math.pow(30 / r0, 1.2), r = r0 * f;
        nx *= f; nz *= f;
        if (r < 11.5 * hsc) {
          const ang = Math.random() * 6.2832, rr = 24 + Math.random() * 6;
          nx = Math.cos(ang) * rr; nz = Math.sin(ang) * rr;
          target[k + 1] = pos[k + 1] = (Math.random() + Math.random() + Math.random() - 1.5) * (0.8 + rr * 0.05);
          pos[k] = nx; pos[k + 2] = nz;
          col[k] = bh[0]; col[k + 1] = bh[1]; col[k + 2] = bh[2];
        }
        const t = Math.min(Math.max((30 - r) / 19, 0), 1);
        colT[k] = bh[0] + (1 - bh[0]) * t; colT[k + 1] = bh[1] + (1 - bh[1]) * t; colT[k + 2] = bh[2] + (1 - bh[2]) * t * t;
      } else if (ratio !== 1) { nx *= ratio; nz *= ratio; }
      target[k] = nx; target[k + 2] = nz;
      if (sh.rigid) {
        const px = pos[k], pz = pos[k + 2];
        pos[k] = px * cs - pz * sn; pos[k + 2] = px * sn + pz * cs;
      }
    }
    pos[k]     += (target[k]     - pos[k])     * s;
    pos[k + 1] += (target[k + 1] - pos[k + 1]) * s;
    pos[k + 2] += (target[k + 2] - pos[k + 2]) * s;
    col[k]     += (colT[k]     - col[k])     * 0.04;
    col[k + 1] += (colT[k + 1] - col[k + 1]) * 0.04;
    col[k + 2] += (colT[k + 2] - col[k + 2]) * 0.04;
  }
  if (act) {
    points.updateMatrixWorld(true);
    inv.copy(points.matrixWorld).invert();
    rayo.setFromCamera(ndc, camera);
    const o = rayo.ray.origin.clone().applyMatrix4(inv), d = rayo.ray.direction.clone().transformDirection(inv);
    const R = 12, rep = modo === "repeler";
    for (let i = 0; i < N; i++) {
      const k = i * 3, vx = pos[k] - o.x, vy = pos[k + 1] - o.y, vz = pos[k + 2] - o.z;
      const tt = vx * d.x + vy * d.y + vz * d.z;
      const px = vx - d.x * tt, py = vy - d.y * tt, pz = vz - d.z * tt;
      const dist = Math.sqrt(px * px + py * py + pz * pz);
      if (dist < R) {
        const f = 1 - dist / R, w = rep ? 0.5 * f * f / (dist + 0.3) : -0.05 * f;
        pos[k] += px * w; pos[k + 1] += py * w; pos[k + 2] += pz * w;
      }
    }
  }
  geo.attributes.position.needsUpdate = true;
  geo.attributes.color.needsUpdate = true;
  holeS += (holeT - holeS) * 0.06;
  hole.scale.setScalar(Math.max(holeS * hsc, 0.001));
  if (!down && performance.now() < tiltUntil) points.rotation.x += (tilt - points.rotation.x) * 0.04;
  if (!down && !reduce) points.rotation.y += 0.004;
  points.scale.setScalar(1 + Math.sin(t * 1.2) * 0.02);
  if (composer) composer.render(); else renderer.render(scene, camera);
}
animar();
</script>
